<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulverize 启动中</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(58% 58% at 50% 38%, rgba(227, 6, 19, 0.2), transparent 72%),
          #050507;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro SC', 'PingFang SC',
          'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .stage { position: relative; width: min(560px, 94vw); text-align: center; padding: 34px 24px 40px; }

      /* ---- 变身舞台（胶囊 → 撕裂爆发 → 字标揭示） ---- */
      .top { position: relative; height: 168px; }
      .ring {
        position: absolute;
        left: 50%; top: 78px;
        width: 120px; height: 120px;
        margin: -60px 0 0 -60px;
        border: 2px solid rgba(227, 6, 19, 0.85);
        border-radius: 50%;
        opacity: 0;
        transform: scale(0.3);
        animation: ringBurst 1s cubic-bezier(0.16, 0.84, 0.3, 1) 0.92s forwards;
      }
      .ring.r2 { border-color: rgba(255, 255, 255, 0.7); animation-delay: 1.04s; }
      @keyframes ringBurst {
        0% { opacity: 0.95; transform: scale(0.3); }
        100% { opacity: 0; transform: scale(5); }
      }

      .capsule {
        position: absolute;
        left: 50%; top: 78px;
        width: 132px; height: 54px;
        margin: -27px 0 0 -66px;
        animation: capIn 0.5s cubic-bezier(0.2, 0.9, 0.25, 1.25) both;
      }
      @keyframes capIn {
        0% { opacity: 0; transform: translateY(-48px) scale(0.6) rotate(-6deg); }
        70% { transform: translateY(4px) scale(1.04) rotate(1deg); }
        100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      }
      .cap-half {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
      }
      .cap-top {
        top: 0;
        border-radius: 999px 999px 6px 6px;
        background: linear-gradient(180deg, #ff3040 0%, #e30613 58%, #a90410 100%);
        filter: drop-shadow(0 0 16px rgba(227, 6, 19, 0.75));
        animation: capUp 0.55s cubic-bezier(0.3, 0, 0.6, 1) 0.95s forwards;
      }
      .cap-bot {
        bottom: 0;
        border-radius: 6px 6px 999px 999px;
        background: linear-gradient(180deg, #d30512 0%, #8d030d 100%);
        animation: capDown 0.55s cubic-bezier(0.3, 0, 0.6, 1) 0.99s forwards;
      }
      @keyframes capUp { to { transform: translate(-22px, -66px) rotate(-26deg); opacity: 0; } }
      @keyframes capDown { to { transform: translate(22px, 66px) rotate(26deg); opacity: 0; } }
      .cap-shine {
        position: absolute;
        left: 13px; top: 7px;
        width: 54px; height: 11px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0));
        animation: capShine 0.3s ease 0.95s forwards;
      }
      @keyframes capShine { to { opacity: 0; } }

      .dots .dot {
        position: absolute;
        left: 50%; top: 78px;
        width: 7px; height: 7px;
        margin: -3.5px 0 0 -3.5px;
        border-radius: 50%;
        background: #ff4a55;
        box-shadow: 0 0 10px rgba(227, 6, 19, 0.9);
        opacity: 0;
        animation: dotFly 0.9s cubic-bezier(0.2, 0.7, 0.4, 1) forwards;
      }
      .dots .dot:nth-child(1) { --a: 0deg;   --d: 118px; animation-delay: 1.0s; }
      .dots .dot:nth-child(2) { --a: 45deg;  --d: 96px;  animation-delay: 1.06s; }
      .dots .dot:nth-child(3) { --a: 90deg;  --d: 128px; animation-delay: 1.02s; }
      .dots .dot:nth-child(4) { --a: 135deg; --d: 88px;  animation-delay: 1.1s; }
      .dots .dot:nth-child(5) { --a: 180deg; --d: 122px; animation-delay: 1.04s; }
      .dots .dot:nth-child(6) { --a: 225deg; --d: 100px; animation-delay: 1.12s; }
      .dots .dot:nth-child(7) { --a: 270deg; --d: 130px; animation-delay: 1.08s; }
      .dots .dot:nth-child(8) { --a: 315deg; --d: 92px;  animation-delay: 1.14s; }
      @keyframes dotFly {
        0% { opacity: 1; transform: rotate(var(--a)) translateX(8px) scale(1); }
        100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scale(0.3); }
      }

      .word {
        position: relative;
        overflow: hidden;
        font-size: clamp(30px, 7vw, 52px);
        font-weight: 800;
        letter-spacing: 0.3em;
        padding-left: 0.3em;
        color: #f5f5f7;
        clip-path: inset(0 100% 0 0);
        animation: wordWipe 0.42s cubic-bezier(0.2, 0.7, 0.3, 1) 1.3s forwards;
      }
      @keyframes wordWipe { to { clip-path: inset(0 0 0 0); } }
      .slash {
        position: absolute;
        left: 6%; right: 6%; top: 50%;
        height: 3px;
        background: linear-gradient(90deg, transparent, #e30613 22%, #ff5a63 50%, #e30613 78%, transparent);
        transform: translateX(-110%) skewX(-28deg);
        opacity: 0;
        animation: slashSweep 0.5s cubic-bezier(0.5, 0, 0.3, 1) 1.38s forwards;
      }
      @keyframes slashSweep {
        15% { opacity: 1; }
        100% { opacity: 0; transform: translateX(110%) skewX(-28deg); }
      }

      .sub {
        margin-top: 12px;
        font-size: 13.5px;
        letter-spacing: 0.32em;
        padding-left: 0.32em;
        color: #8f8f97;
        opacity: 0;
        animation: fadeUp 0.4s ease 1.62s forwards;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .spinner {
        width: 34px; height: 34px;
        margin: 30px auto 16px;
        border: 3px solid rgba(227, 6, 19, 0.18);
        border-top-color: #e30613;
        border-radius: 50%;
        animation: sp 0.8s linear infinite, fadeIn 0.4s ease 1.75s both;
      }
      @keyframes sp { to { transform: rotate(360deg); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      .status { font-size: 14.5px; color: #8f8f97; line-height: 1.7; min-height: 44px; animation: fadeIn 0.4s ease 1.8s both; }
      .status.err { color: #ff5a63; }
      button {
        display: none;
        margin: 14px auto 0;
        padding: 10px 30px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: #e30613;
        border: 0;
        border-radius: 980px;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover { background: #c70511; }
      button.show { display: inline-block; }

      @media (prefers-reduced-motion: reduce) {
        .ring, .capsule, .cap-top, .cap-bot, .cap-shine, .dots .dot,
        .word, .slash, .sub, .spinner, .status {
          animation: none !important;
        }
        .word { clip-path: none; }
        .sub, .status { opacity: 1; }
        .dots .dot { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="top">
        <span class="ring" />
        <span class="ring r2" />
        <div class="capsule">
          <i class="cap-half cap-top" />
          <i class="cap-half cap-bot" />
          <i class="cap-shine" />
        </div>
        <div class="dots">
          <span class="dot" /><span class="dot" /><span class="dot" /><span class="dot" />
          <span class="dot" /><span class="dot" /><span class="dot" /><span class="dot" />
        </div>
      </div>

      <div class="word">
        PULVERIZE
        <span class="slash" />
      </div>
      <p class="sub">个人运动数据分析 · AI 教练</p>

      <div class="spinner" id="sp" />
      <p class="status" id="st">正在检测本地服务…</p>
      <button id="retry">重试</button>
    </div>
    <script>
      var fails = 0
      var st = document.getElementById('st')
      var retryBtn = document.getElementById('retry')
      function poll() {
        fetch('/__health', { cache: 'no-store' })
          .then(function (r) { return r.json() })
          .then(function (h) {
            if (h.up) {
              st.className = 'status'
              st.textContent = '后端已就绪，正在进入…'
              setTimeout(function () { location.replace('/') }, 400)
              return
            }
            fails++
            if (!h.dist) {
              st.className = 'status err'
              st.textContent = '未找到前端构建产物：请先在 frontend/ 目录执行 npm run build'
              return
            }
            if (h.error) {
              st.className = 'status err'
              st.textContent = '启动失败：' + h.error
              retryBtn.className = 'show'
              return
            }
            st.className = 'status'
            st.textContent = h.spawned
              ? '正在启动后端服务（首次约 20–40 秒）…'
              : '正在启动本地服务… ' + Math.ceil(fails * 1.5) + 's'
            setTimeout(poll, 1500)
          })
          .catch(function () {
            fails++
            st.className = 'status err'
            st.textContent = '本地服务异常，正在重试…'
            setTimeout(poll, 2000)
          })
      }
      retryBtn.addEventListener('click', function () {
        retryBtn.className = ''
        st.className = 'status'
        st.textContent = '正在重试…'
        fetch('/__retry', { method: 'POST' }).then(function () { setTimeout(poll, 800) })
      })
      poll()
    </script>
  </body>
</html>
