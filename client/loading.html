<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RunAI 启动中</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f7;
        color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro SC', 'PingFang SC',
          'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card { text-align: center; padding: 40px; }
      .logo { width: 76px; height: 73px; margin: 0 auto 22px; }
      h1 { font-size: 34px; letter-spacing: -0.5px; font-weight: 700; margin-bottom: 6px; }
      .sub { font-size: 14px; color: #86868b; margin-bottom: 34px; }
      .spinner {
        width: 36px; height: 36px; margin: 0 auto 20px;
        border: 3px solid rgba(227, 6, 19, 0.16);
        border-top-color: #e30613;
        border-radius: 50%;
        animation: sp 0.8s linear infinite;
      }
      @keyframes sp { to { transform: rotate(360deg); } }
      .status { font-size: 15px; color: #6e6e73; line-height: 1.7; min-height: 50px; }
      .status.err { color: #e30613; }
      button {
        display: none; margin: 18px auto 0;
        padding: 10px 30px; font-size: 15px; font-weight: 600;
        color: #fff; background: #e30613; border: 0; border-radius: 980px;
        cursor: pointer; font-family: inherit;
      }
      button:hover { background: #c70511; }
      button.show { display: inline-block; }
      @media (prefers-color-scheme: dark) {
        body { background: #000; color: #f5f5f7; }
        .status { color: #aeaeb2; }
        .sub { color: #6e6e73; }
        .spinner { border-color: rgba(255, 59, 48, 0.2); border-top-color: #ff3b30; }
        button { background: #ff3b30; }
        button:hover { background: #ff5147; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="76" height="73" viewBox="0 0 48 46">
          <rect width="48" height="46" rx="10" fill="#e30613" />
          <g transform="translate(9.45 9.1) scale(0.62)">
            <path
              fill="#ffffff"
              d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
            />
          </g>
        </svg>
      </div>
      <h1>RunAI</h1>
      <p class="sub">智能跑步数据分析</p>
      <div class="spinner" id="sp"></div>
      <p class="status" id="st">正在检测本地服务…</p>
      <button id="retry">重试</button>
    </div>
    <script>
      var fails = 0
      var st = document.getElementById('st')
      var retryBtn = document.getElementById('retry')
      function poll() {
        fetch('/__health', { cache: 'no-store' })
          .then(function (r) { return r.json() })
          .then(function (h) {
            if (h.up) {
              st.className = 'status'
              st.textContent = '后端已就绪，正在进入…'
              setTimeout(function () { location.replace('/') }, 400)
              return
            }
            fails++
            if (!h.dist) {
              st.className = 'status err'
              st.textContent = '未找到前端构建产物：请先在 frontend/ 目录执行 npm run build'
              return
            }
            if (h.error) {
              st.className = 'status err'
              st.textContent = '启动失败：' + h.error
              retryBtn.className = 'show'
              return
            }
            st.className = 'status'
            st.textContent = h.spawned
              ? '正在启动后端服务（首次约 20–40 秒）…'
              : '正在启动本地服务… ' + Math.ceil(fails * 1.5) + 's'
            setTimeout(poll, 1500)
          })
          .catch(function () {
            fails++
            st.className = 'status err'
            st.textContent = '本地服务异常，正在重试…'
            setTimeout(poll, 2000)
          })
      }
      retryBtn.addEventListener('click', function () {
        retryBtn.className = ''
        st.className = 'status'
        st.textContent = '正在重试…'
        fetch('/__retry', { method: 'POST' }).then(function () { setTimeout(poll, 800) })
      })
      poll()
    </script>
  </body>
</html>
