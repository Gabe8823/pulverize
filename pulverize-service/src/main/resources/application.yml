server:
  port: 2021
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT —— 签名密钥不入库：优先读环境变量 RUNAI_JWT_SECRET，其次 ~/.pulverize/jwt.secret（LocalSecretsEnvironmentPostProcessor 自动装载/生成），
# 下列默认值仅为占位（无效于生产），历史版本中出现过真实密钥，已完成轮换与历史清除
jwt:
  secret: ${RUNAI_JWT_SECRET:pulverize-local-dev-secret-DO-NOT-PROD-000000}
  expiration: 7200000       # 2小时 (毫秒)
  refresh-expiration: 604800000  # 7天
  header: Authorization
  prefix: "Bearer "

# Logging
logging:
  level:
    com.run: debug
    com.baomidou.mybatisplus: debug
