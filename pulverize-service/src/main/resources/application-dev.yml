spring:
  datasource:
    url: jdbc:mysql://localhost:3306/run_ai?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    # 密码不入库：优先环境变量 RUNAI_DB_PASSWORD，其次 ~/.pulverize/db.password（本地 keystore），
    # 默认值 root 仅供全新环境首次初始化，本机真实密码已轮换并存于本地文件
    password: ${RUNAI_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # 不设password即无密码连接
  autoconfigure:
    # 开发环境排除未安装的中间件，防止启动阻塞
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # RabbitMQ同理，开发环境不阻塞
    listener:
      simple:
        auto-startup: false

# Aliyun OSS (dev 环境不启用；真实密钥一律走环境变量，禁止写入仓库)
aliyun:
  oss:
    enabled: false
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket: running-dev
    domain: https://running-dev.oss-cn-hangzhou.aliyuncs.com
    access-key: ${ALIYUN_OSS_ACCESS_KEY:dev-key}
    secret-key: ${ALIYUN_OSS_SECRET_KEY:dev-secret}

# AI（兜底示例：任意 OpenAI 兼容接口均可；真实地址/模型/密钥在页面「AI 服务配置」配置，或经环境变量注入）
ai:
  api:
    url: ${AI_API_URL:https://api.deepseek.com/chat/completions}
    key: ${AI_API_KEY:sk-placeholder}
    model: ${AI_API_MODEL:deepseek-chat}
